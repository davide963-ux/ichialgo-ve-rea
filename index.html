<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050807" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Ichialgo | Forex terminal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Chatbot widget. Third-party, loaded async so it never blocks the app's
      own bundle or first paint, and placed last so the terminal is interactive
      before it arrives. It mounts its own element; nothing in src/ refers to
      it, so removing this one line removes the widget entirely.
    -->
    <script
      src="https://chatbot-platform-beta.vercel.app/widget.js"
      data-bot-id="zb_UV7kQwXQIqLZnedkedjPNa"
      async
    ></script>
  </body>
</html>
