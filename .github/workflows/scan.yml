# Scheduled trigger for the signal scanner.
#
# WHY THIS EXISTS INSTEAD OF A VERCEL CRON
# ────────────────────────────────────────
# Vercel's Hobby plan runs a cron job once a day, accurate to within the hour.
# The strategy is evaluated on 30-minute bars, so that is useless here. GitHub
# Actions schedules are free and unlimited on a public repository and go down
# to five minutes, so the schedule lives here and Vercel just answers the POST.
#
# WHY THERE IS NO SECRET TO SET UP
# ────────────────────────────────
# `id-token: write` lets this run ask GitHub for a short-lived token that says
# which repository, workflow and ref it came from, signed by GitHub. The
# endpoint verifies that against GitHub's public keys. Nothing is stored on
# either side: no secret to create, paste into two places, keep in step, or
# rotate — and a token copied out of a log expires in minutes and names the
# run it came from.
#
# WHY LATENESS IS NOT A PROBLEM
# ─────────────────────────────
# GitHub makes no punctuality promise: scheduled runs are queued at low
# priority and are routinely minutes late, occasionally skipped, sometimes
# bunched. The scanner is built for that — every run re-reads the last few
# closed bars (SCAN_LOOKBACK_BARS, four by default = two hours on 30M) and the
# signal id is deterministic, so a late run catches up and a repeated run
# writes nothing twice. Missing one firing costs nothing.
#
# ⚠️  GitHub disables scheduled workflows on a repository with no commits for
#     60 days, and emails the owner first. If signals stop appearing, check
#     the Actions tab before suspecting the scanner.
name: scan

on:
  schedule:
    # Every 15 minutes, Monday to Friday. Forex is shut at the weekend, so
    # Saturday is skipped entirely and Sunday only from the 22:00 UTC open.
    # Friday evening after the close is left in: the scanner simply finds no
    # newly closed bar, which costs one request and writes nothing.
    - cron: '*/15 * * * 1-5'
    - cron: '*/15 22-23 * * 0'
  # So it can be run by hand from the Actions tab — the quickest way to check
  # the deployment and the database after changing either.
  workflow_dispatch:

# A run takes seconds; two overlapping ones would only duplicate work that the
# database would then reject. Let the in-flight one finish.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  # The whole of the authentication setup. Without it the runner cannot mint
  # an identity token and the endpoint has no reason to trust the call.
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the scan
        env:
          # Optional override; defaults to the production domain.
          SCAN_URL: ${{ vars.SCAN_URL || 'https://ichialgo.world/api/scan' }}
          # Must match SCAN_AUDIENCE in server/scanAuth.mjs. Checked on the
          # other side so a token minted for some other service that also
          # trusts this repository cannot be replayed here.
          SCAN_AUDIENCE: ichialgo-scan
        run: |
          set -euo pipefail

          # Ask the Actions runtime for an identity token. These two variables
          # exist only because of `permissions: id-token: write` above.
          id_token=$(curl --silent --show-error --fail --max-time 30 \
                       -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                       "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SCAN_AUDIENCE}" \
                     | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')

          if [ -z "${id_token}" ]; then
            echo "::error::Could not get an OIDC token from the Actions runtime."
            exit 1
          fi

          # Separate the body from the status line so both can be reported:
          # a failing scan returns a JSON body that says which pair broke, and
          # throwing it away would make every failure look the same.
          http=$(curl --silent --show-error \
                      --max-time 120 --retry 2 --retry-delay 10 --retry-connrefused \
                      --output body.json --write-out '%{http_code}' \
                      -X POST "${SCAN_URL}" \
                      -H "Authorization: Bearer ${id_token}" \
                      -H 'Content-Length: 0' ) || true

          echo "HTTP ${http}"
          cat body.json || true
          echo

          # Summary on the run page, so the Actions tab is readable at a glance.
          {
            echo "### Scan — HTTP ${http}"
            echo ''
            echo '```json'
            cat body.json 2>/dev/null || echo '(no body)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${http}" != "200" ]; then
            echo "::error::Scan failed with HTTP ${http}"
            exit 1
          fi
